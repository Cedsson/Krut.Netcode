name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Derive version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Krut.Netcode.slnx

      - name: Build
        run: dotnet build Krut.Netcode.slnx -c Release --no-restore -warnaserror -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test Krut.Netcode.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/Krut.Netcode/Krut.Netcode.csproj -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${{ steps.ver.outputs.version }}" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "$GITHUB_REF_NAME" --generate-notes $PRE

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY secret is not set, skipping nuget.org push"
            exit 0
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
