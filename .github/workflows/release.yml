name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semver tag to publish (e.g. v1.0.0). Leave empty to cut a new release from main.'
        required: false
        default: ''

# Two releases at the same time would both tag the same version, and the second
# would try to push a tag that already exists.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Git config
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - uses: actions/setup-node@v7
      with:
        node-version: '20'

    # Pinned to 9.5.0 because of what .versionrc.json uses (packageFiles +
    # bumpFiles + infile).
    - name: Install standard-version
      run: npm install -g standard-version@9.5.0

    - name: Bump version, changelog and tag
      id: version
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        if [ -n "$INPUT_TAG" ]; then
          if ! echo "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Input tag '$INPUT_TAG' must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git checkout "$INPUT_TAG"
          VERSION=${INPUT_TAG#v}
          if ! grep -q "<Version>$VERSION</Version>" src/Krut.Netcode/Krut.Netcode.csproj; then
            echo "::error::csproj is missing <Version>$VERSION</Version> at tag $INPUT_TAG."
            exit 1
          fi
          echo "Publishing existing tag $INPUT_TAG"
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "existing_tag=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        LAST_TAG=$(git tag --points-at HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

        if [ -n "$LAST_TAG" ]; then
          echo "HEAD is already tagged as $LAST_TAG - skipping."
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        LAST_RELEASE=$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

        if ! node scripts/has-releasable-commits.cjs "$LAST_RELEASE"; then
          echo "No releasable changes since ${LAST_RELEASE:-repo-start} - skipping release."
          echo "release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$LAST_RELEASE" ]; then
          standard-version --first-release --no-verify || echo "standard-version exited with code $?"
        else
          standard-version --no-verify || echo "standard-version exited with code $?"
        fi

        TAG=$(git tag --points-at HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

        if [ -z "$TAG" ]; then
          echo "::error::standard-version created no valid semver tag. See the log above - this is an error, not 'nothing to release'."
          git reset --hard HEAD
          git clean -fd
          exit 1
        fi

        VERSION=${TAG#v}

        if ! grep -q "<Version>$VERSION</Version>" src/Krut.Netcode/Krut.Netcode.csproj; then
          echo "::error::csproj is missing <Version>$VERSION</Version> - the tag $TAG and the project have drifted apart."
          exit 1
        fi

        echo "Releasing $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "release=true" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-dotnet@v6
      if: steps.version.outputs.release == 'true'
      with:
        dotnet-version: 9.0.x

    - name: Build, test and pack NuGet package
      if: steps.version.outputs.release == 'true'
      run: |
        dotnet restore Krut.Netcode.slnx
        dotnet build Krut.Netcode.slnx -c Release --no-restore -warnaserror -p:Version=${{ steps.version.outputs.version }}
        dotnet test Krut.Netcode.slnx -c Release --no-build
        dotnet pack src/Krut.Netcode/Krut.Netcode.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

    - name: Push commit and tag
      if: steps.version.outputs.release == 'true' && steps.version.outputs.existing_tag != 'true'
      run: git push origin main --follow-tags

    - name: Create GitHub Release
      if: steps.version.outputs.release == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.tag }}
        body_path: CHANGELOG.md
        files: |
          artifacts/*.nupkg
          artifacts/*.snupkg
        draft: false
        prerelease: false

    - name: Log in to NuGet (Trusted Publishing)
      if: steps.version.outputs.release == 'true'
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER || 'Cedsson' }}

    - name: Push to nuget.org
      if: steps.version.outputs.release == 'true'
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        if [ -z "$NUGET_API_KEY" ]; then
          echo "::error::NuGet Trusted Publishing OIDC login did not return an API key."
          exit 1
        fi
        dotnet nuget push "artifacts/*.nupkg" \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
