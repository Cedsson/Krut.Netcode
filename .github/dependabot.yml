version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Microsoft.SourceLink.GitHub 11.x transitively requires System.IO.Hashing 11.x (net10.0+).
      - dependency-name: "Microsoft.SourceLink.GitHub"
        versions: [">= 11.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      actions-dependencies:
        patterns:
          - "*"
